# dsh-msp：把本机 MSP 网络上每个节点的工具接到 DeepSeek Harness
# 行按 id 定位；后写覆盖先写，config 整行替换（不合并）。
- insert:
    - id: dsh-msp
      name: dsh-msp
      config:
        nodesDir: ~/.msp/nodes
        includeNodes: []        # 非空 = 只连这些节点（白名单）
        excludeNodes: []        # 黑名单，例如 [test.node1, demo_signals]
        toolPrefix: msp_
        discoveryMs: 3000
        callTimeoutMs: 30000
        retryMs: 3000
        staleAfterMs: 30000
        maxPeers: 16
        verbose: false
