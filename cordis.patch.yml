# dsh-msp：把本机 MSP 网络上每个节点的工具接到 DeepSeek Harness
# 行按 id 定位；后写覆盖先写，config 整行替换（不合并）。
- insert:
    - id: dsh-msp
      name: dsh-msp
      config:
        nodesDir: ~/.msp/nodes
        includeNodes: []
        excludeNodes: []
        toolPrefix: msp_
        discoveryMs: 3000
        callTimeoutMs: 30000
        retryMs: 3000
        staleAfterMs: 30000
        maxPeers: 16
        # —— 通知：把"需要你"的瞬间弹到灵动岛 ——
        # 两条通道：公告(信号,广播) + 投递(工具,命令)
        signalPath: dsh.attention.requested
        useSignal: true                 # 广播"需要用户注意"，供联动方订阅
        useTool: true                   # 真正弹窗（只有命令能弹）
        notifyNode: notchpeninsula      # 用哪个节点弹（没连上会自动找别的）
        notifyIcon: true                # 通知带鲸鱼娘图标（包内 assets/）
        notifyIconPath: null            # 想换图就填绝对路径
        notifyMinIntervalMs: 3000       # 同类通知的最小间隔
        notifyOnApproval: true          # 有操作等你确认
        notifyOnQuestion: true          # 模型在问你问题
        notifyOnTurnEnd: true           # 一轮任务结束
        turnEndMinMs: 20000             # 只有跑够这么久才提醒，避免刷屏
        verbose: false                  # 打开会把每次事件首次命中的 payload 打进日志
